name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install -r blog/content-mirror/automation/requirements-test.txt

      - name: Test content mirror
        run: python -B -m unittest discover -s blog/content-mirror/automation -p "test_*.py"

      - name: Test enrichment
        run: python -B -m unittest discover -s blog/enrichment/automation -p "test_*.py"

      - name: Test blog update
        run: python -B -m unittest discover -s blog -p "test_update.py"
